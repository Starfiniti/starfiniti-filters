name: starfiniti-search-observability

services:
  prometheus:
    image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 0.50
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle=false
    ports:
      - "127.0.0.1:9090:9090"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [observability, monitoring_egress]
    logging: &bounded_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  loki:
    image: grafana/loki@sha256:a678400d75866739e70cf413de834b929c8ac500256bc6beedf17a91ab6430a3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 0.40
    mem_limit: 384m
    command: [-config.file=/etc/loki/config.yml]
    ports:
      - "10.10.10.61:3100:3100"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [observability]
    logging: *bounded_logging

  grafana:
    image: grafana/grafana@sha256:035dfe16f7a3a109b54f2ac032232b07d069aa732156480555b2391fc0a32813
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 0.40
    mem_limit: 320m
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: starfiniti-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=472,gid=0
      - /var/log/grafana:rw,noexec,nosuid,nodev,size=32m,uid=472,gid=0
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/starfiniti.yml:ro
      - grafana_data:/var/lib/grafana
    networks: [observability]
    logging: *bounded_logging

  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 0.10
    mem_limit: 96m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [observability]
    logging: *bounded_logging

  alloy:
    image: grafana/alloy@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 0.20
    mem_limit: 192m
    command: [run, /etc/alloy/config.alloy]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/lib/alloy:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./ops-alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [observability]
    logging: *bounded_logging

networks:
  observability:
    internal: true
  monitoring_egress:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

secrets:
  grafana_admin_password:
    file: /etc/starfiniti-observability/grafana-admin-password
