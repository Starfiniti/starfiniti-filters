name: CI

on:
  push:
    branches: [main, v1]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run lint:php

  playground:
    name: Checks in WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  database:
    name: WP ${{ matrix.wordpress }} / WC ${{ matrix.woocommerce }} / PHP ${{ matrix.php }} on MariaDB
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.6'
            woocommerce: '9.6.0'
            php: '8.1'
          - wordpress: latest
            woocommerce: latest
            php: '8.3'
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wordpress_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP: /tmp/wordpress
      PLUGIN: /tmp/wordpress/wp-content/plugins/starfiniti-filters
      SFFILTERS_TEST_URL: http://127.0.0.1:8080
      SFFILTERS_TEST_RESULTS: /tmp/sffilters-test-results.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli
          tools: wp-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install WordPress, WooCommerce and Storefront
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          WC_VERSION: ${{ matrix.woocommerce }}
        run: |
          wp core download --path="$WP" --version="$WP_VERSION"
          wp config create --path="$WP" --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --path="$WP" --url="$SFFILTERS_TEST_URL" --title=Test --admin_user=admin --admin_password=password --admin_email=admin@example.com --skip-email
          wp theme install storefront --path="$WP" --activate
          if [ "$WC_VERSION" = "latest" ]; then
            wp plugin install woocommerce --path="$WP" --activate
          else
            wp plugin install woocommerce --path="$WP" --version="$WC_VERSION" --activate
          fi
      - name: Install the plugin and the demo catalog
        run: |
          mkdir -p "$PLUGIN"
          git archive HEAD | tar -x -C "$PLUGIN"
          wp plugin activate starfiniti-filters --path="$WP"
          wp eval-file "$PLUGIN/playground/setup.php" --path="$WP"
      - name: Run the checks
        run: wp eval-file "$PLUGIN/tests/checks.php" --path="$WP"
      - name: Ask the shop pages
        run: |
          wp server --path="$WP" --host=127.0.0.1 --port=8080 > /tmp/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null "$SFFILTERS_TEST_URL/shop/" && break
            sleep 1
          done
          node tests/run.mjs

  package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run package
      - name: Check what is in the ZIP
        run: |
          unzip -l dist/*.zip
          unzip -Z1 dist/*.zip > /tmp/files.txt
          grep -qx 'starfiniti-filters/starfiniti-filters.php' /tmp/files.txt
          grep -qx 'starfiniti-filters/src/Updater.php' /tmp/files.txt
          ! grep -v '^starfiniti-filters/' /tmp/files.txt
          ! grep -E '/(tests|scripts|playground|node_modules|\.github)/|package(-lock)?\.json|AGENTS\.md|CLAUDE\.md' /tmp/files.txt
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starfiniti-filters-package
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, playground, database, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: starfiniti-filters-package
          path: dist
      - name: Check the tag against the version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          (cd dist && sha256sum -c "starfiniti-filters-$version.zip.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/starfiniti-filters-$version.zip" \
            "dist/starfiniti-filters-$version.zip.sha256" \
            --verify-tag \
            --title "Starfiniti Filters $version" \
            --notes-file /tmp/notes.md
